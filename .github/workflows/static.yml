name: Build and validate book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Pandoc and crossref versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/book-tools"
          cd "$RUNNER_TEMP/book-tools"
          curl --fail --location --retry 3 https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz -o pandoc.tar.gz
          curl --fail --location --retry 3 https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.25a/pandoc-crossref-Linux-X64.tar.xz -o crossref.tar.xz
          echo '37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  pandoc.tar.gz' | sha256sum -c -
          echo '7f8b7c5c91233db2dcb1145fa580a9ee8343695589bdb0ece8661490bc12a644  crossref.tar.xz' | sha256sum -c -
          tar -xzf pandoc.tar.gz
          tar -xJf crossref.tar.xz
          echo "$RUNNER_TEMP/book-tools/pandoc-3.11/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/book-tools" >> "$GITHUB_PATH"
      - name: Build and check
        run: |
          pandoc --version
          pandoc-crossref --version
          make -j4 html epub
          make check
      - uses: actions/upload-artifact@v4
        with:
          name: book-html-epub
          path: |
            build/html/
            build/epub/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jweihe/RLHF-book-Chinese'
        with:
          path: build/html/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jweihe/RLHF-book-Chinese'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
